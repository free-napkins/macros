<!DOCTYPE html>
<!--
  ============================================================
  MACRO RINGS LAB
  ============================================================
  WHAT THIS IS
  A self-contained visual playground comparing 8 different ways
  to render "progress toward a daily macro/nutrient target"
  (e.g. protein 62g of a 150g goal). Built to help pick a style
  for the real macro-tracker app's "Today" totals view.

  No build step, no dependencies — vanilla HTML/CSS/JS in one
  file. Only external resource is a Google Fonts <link>.

  WORKFLOW
  1. Open this file directly in a browser (double-click it, or
     drag it into a tab). No server needed.
  2. Play with the sticky control bar at the top — theme colors,
     animation style, scenario, sliders, toggles. Every card
     reacts live to every control at once.
  3. Found a card you like, or want changed? Tell Claude in
     plain language, e.g. "card 3, make the segments thicker"
     or "card 6, add a 5th spoke for fiber". Reference cards by
     the number in their corner tag.
  4. Claude edits this file directly. Refresh your browser tab
     to see the change (no rebuild, it's just a static file).
  5. Once a style earns its keep, tell Claude to port it into
     the real app's component (currently src/components/
     TodayTotals.jsx).
  ============================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Macro Rings Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --accent: #6EE7B7;
    --accent-glow: color-mix(in srgb, var(--accent) 45%, transparent);
    --accent-dim: color-mix(in srgb, var(--accent) 15%, transparent);
    --warn: #F59E0B;
    --danger: #EF4444;
    --muted: rgba(255,255,255,.5);
    --muted-strong: rgba(255,255,255,.72);
    --border: rgba(255,255,255,.1);
    --border-strong: rgba(255,255,255,.18);
    --card: rgba(255,255,255,.025);

    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;

    --ease: cubic-bezier(.16,1,.3,1);
    --dur: 1000ms;
    --thickness: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: var(--font-sans);
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: -10% -5%;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 50% 35% at 72% 15%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 65%),
      radial-gradient(ellipse 45% 32% at 15% 85%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%);
    transition: background 400ms var(--ease);
  }

  html.reduced-motion *,
  html.reduced-motion *::before,
  html.reduced-motion *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(0,0,0,.62);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
  }

  .topbar-inner {
    max-width: 1600px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 8px;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: var(--accent);
    box-shadow: 0 0 18px var(--accent-glow);
    flex-shrink: 0;
    transition: background 300ms var(--ease), box-shadow 300ms var(--ease);
  }

  .brand-name {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.35rem;
    letter-spacing: -.01em;
    white-space: nowrap;
  }

  .controls {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 18px 26px;
    flex: 1;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-label {
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .swatch-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    transition: transform 160ms var(--ease), border-color 160ms var(--ease);
  }

  .swatch:hover { transform: scale(1.12); }
  .swatch.selected { border-color: #fff; }

  .color-input {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    padding: 0;
    background: none;
    cursor: pointer;
    overflow: hidden;
  }
  .color-input::-webkit-color-swatch-wrapper { padding: 0; }
  .color-input::-webkit-color-swatch { border: none; border-radius: 50%; }

  select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: .82rem;
    padding: 7px 10px;
    border-radius: 7px;
    outline: none;
    cursor: pointer;
  }
  select:hover { border-color: var(--border-strong); }
  select:focus { border-color: var(--accent); }

  .slider-group { min-width: 150px; }
  .slider-row { display: flex; align-items: center; gap: 8px; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 120px;
    height: 3px;
    border-radius: 2px;
    background: var(--border-strong);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    cursor: pointer;
    transition: background 200ms var(--ease);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .slider-value {
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted-strong);
    min-width: 42px;
  }

  .toggles {
    flex-direction: row;
    gap: 16px;
    align-items: center;
  }
  .toggles label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .78rem;
    color: var(--muted-strong);
    cursor: pointer;
    white-space: nowrap;
  }
  .toggles input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
  }

  /* ---------- Grid & cards ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 24px;
    padding: 32px 28px 80px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .card {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--card);
    padding: 28px 24px 24px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    transition: border-color 250ms var(--ease), box-shadow 250ms var(--ease);
  }
  .card:hover {
    border-color: var(--border-strong);
    box-shadow: 0 0 40px rgba(255,255,255,.03);
  }

  .card-tag {
    position: absolute;
    top: 16px;
    left: 20px;
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .12em;
    color: var(--muted);
  }

  .card-actions {
    position: absolute;
    top: 14px;
    right: 16px;
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.02);
    color: var(--muted-strong);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .85rem;
    transition: border-color 160ms var(--ease), color 160ms var(--ease), background 160ms var(--ease), transform 160ms var(--ease);
  }
  .icon-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.copied { color: var(--accent); border-color: var(--accent); }

  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 22px;
    gap: 16px;
  }

  .card-title {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 1.1rem;
    color: var(--muted-strong);
    text-align: center;
  }

  /* ---------- shared ring/svg pieces ---------- */
  .ring-svg { display: block; overflow: visible; }
  .ring-track { fill: none; stroke: color-mix(in srgb, var(--accent) 14%, transparent); stroke-width: var(--thickness); }
  .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: var(--thickness);
    stroke-linecap: round;
    transition: stroke-dashoffset var(--dur) var(--ease), stroke var(--dur) var(--ease), stroke-width 200ms var(--ease);
  }
  .ring-fill.glow { filter: drop-shadow(0 0 8px var(--accent-glow)); }
  .ring-fill.is-over { stroke: var(--warn); }
  .ring-fill.is-over.glow { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--warn) 55%, transparent)); }

  .ring-wrap { position: relative; }
  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }
  .ring-value {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 2.4rem;
    line-height: 1;
    color: var(--fg);
  }
  .ring-value.is-over { color: var(--warn); }
  .ring-target {
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .1em;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
  }

  .legend {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: .74rem;
  }
  .legend-row { display: flex; align-items: center; gap: 8px; color: var(--muted-strong); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-row.is-over { color: var(--warn); }

  .cluster-layout { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; justify-content: center; }

  /* ---------- card 3: segmented ring ---------- */
  .seg { transform-origin: 100px 100px; }
  .seg-line {
    stroke: color-mix(in srgb, var(--accent) 16%, transparent);
    stroke-width: var(--thickness);
    stroke-linecap: round;
    transition: stroke var(--dur) var(--ease), opacity var(--dur) var(--ease);
  }
  .seg-line.filled { stroke: var(--accent); }
  .seg-line.filled.glow { filter: drop-shadow(0 0 5px var(--accent-glow)); }
  .seg-line.filled.is-over { stroke: var(--warn); }

  /* ---------- card 4: arc gauge ---------- */
  .gauge-needle {
    stroke: var(--fg);
    stroke-width: 2.5;
    stroke-linecap: round;
    transition: transform var(--dur) var(--ease);
    transform-origin: 100px 100px;
  }
  .gauge-hub { fill: var(--fg); }

  /* ---------- card 5: liquid fill ---------- */
  .liquid-wrap {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--border-strong);
    background: color-mix(in srgb, var(--accent) 4%, transparent);
  }
  .liquid-level {
    position: absolute;
    left: -5%;
    width: 110%;
    bottom: 0;
    height: 0%;
    transition: height var(--dur) var(--ease);
  }
  .liquid-level.is-over .liquid-fill-color { background: color-mix(in srgb, var(--warn) 65%, transparent); }
  .liquid-fill-color {
    position: absolute;
    inset: 0;
    top: 14px;
    background: color-mix(in srgb, var(--accent) 65%, transparent);
  }
  .liquid-wave {
    position: absolute;
    left: 50%;
    top: 0;
    width: 220%;
    height: 220%;
    margin-left: -110%;
    margin-top: -190%;
    border-radius: 42%;
    background: inherit;
    animation: wave-spin 9s linear infinite;
  }
  @keyframes wave-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .liquid-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* ---------- card 6: radial spokes ---------- */
  .spoke-line {
    stroke: var(--accent);
    stroke-linecap: round;
    transition: stroke-dashoffset var(--dur) var(--ease), stroke var(--dur) var(--ease);
  }
  .spoke-line.is-over { stroke: var(--warn); }
  .spoke-line.glow { filter: drop-shadow(0 0 5px var(--accent-glow)); }
  .spoke-track { stroke: color-mix(in srgb, var(--accent) 14%, transparent); }
  .spoke-label {
    font-family: var(--font-mono);
    font-size: 9px;
    fill: var(--muted-strong);
    text-anchor: middle;
  }
  .spoke-hub { fill: var(--fg); }

  /* ---------- card 7: counting number ---------- */
  .count-caption {
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- card 8: capsule bars ---------- */
  .capsule-list { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .capsule-row { display: flex; flex-direction: column; gap: 6px; }
  .capsule-row-head {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--muted-strong);
  }
  .capsule-track {
    width: 100%;
    height: var(--thickness);
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    overflow: hidden;
  }
  .capsule-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: var(--accent);
    transition: width var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .capsule-fill.glow { box-shadow: 0 0 10px var(--accent-glow); }
  .capsule-fill.is-over { background: var(--warn); }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; padding: 24px 16px 60px; }
    .topbar-inner { padding: 14px 16px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">macro rings lab</span>
    </div>

    <div class="controls">
      <div class="control-group">
        <span class="control-label">Theme</span>
        <div class="swatch-row">
          <div class="swatch-row" id="swatches"></div>
          <input type="color" id="customColor" class="color-input" value="#6EE7B7" aria-label="Custom accent color" />
        </div>
      </div>

      <div class="control-group">
        <label class="control-label" for="animStyle">Animation</label>
        <select id="animStyle">
          <option value="ease">Ease (premium)</option>
          <option value="elastic">Elastic</option>
          <option value="linear">Linear</option>
          <option value="stepped">Stepped</option>
        </select>
      </div>

      <div class="control-group">
        <label class="control-label" for="dataset">Scenario</label>
        <select id="dataset">
          <option value="empty">Empty day</option>
          <option value="under">Under target</option>
          <option value="ontarget" selected>Right on target</option>
          <option value="over">Over target</option>
        </select>
      </div>

      <div class="control-group slider-group">
        <label class="control-label" for="manualFill">Manual fill</label>
        <div class="slider-row">
          <input type="range" id="manualFill" min="-1" max="100" value="-1" />
          <span class="slider-value" id="manualFillValue">OFF</span>
        </div>
      </div>

      <div class="control-group slider-group">
        <label class="control-label" for="duration">Duration</label>
        <div class="slider-row">
          <input type="range" id="duration" min="300" max="2500" step="50" value="1000" />
          <span class="slider-value" id="durationValue">1000ms</span>
        </div>
      </div>

      <div class="control-group slider-group">
        <label class="control-label" for="thickness">Thickness</label>
        <div class="slider-row">
          <input type="range" id="thickness" min="4" max="28" value="12" />
          <span class="slider-value" id="thicknessValue">12px</span>
        </div>
      </div>

      <div class="control-group toggles">
        <label><input type="checkbox" id="toggleValue" checked /> Values</label>
        <label><input type="checkbox" id="toggleGlow" checked /> Glow</label>
        <label><input type="checkbox" id="toggleReduced" /> Reduced motion</label>
      </div>
    </div>
  </div>
</header>

<main class="grid" id="grid">

  <section class="card" data-card="1">
    <div class="card-tag">01 · STROKE RING</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card1-body"></div>
  </section>

  <section class="card" data-card="2">
    <div class="card-tag">02 · CONCENTRIC CLUSTER</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card2-body"></div>
  </section>

  <section class="card" data-card="3">
    <div class="card-tag">03 · SEGMENTED RING</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card3-body"></div>
  </section>

  <section class="card" data-card="4">
    <div class="card-tag">04 · ARC GAUGE</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card4-body"></div>
  </section>

  <section class="card" data-card="5">
    <div class="card-tag">05 · LIQUID FILL</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card5-body"></div>
  </section>

  <section class="card" data-card="6">
    <div class="card-tag">06 · RADIAL SPOKES</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card6-body"></div>
  </section>

  <section class="card" data-card="7">
    <div class="card-tag">07 · COUNTING NUMBER</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card7-body"></div>
  </section>

  <section class="card" data-card="8">
    <div class="card-tag">08 · CAPSULE BARS</div>
    <div class="card-actions">
      <button class="icon-btn replay-btn" title="Replay">&#10227;</button>
      <button class="icon-btn copy-btn" title="Copy">&#10697;</button>
    </div>
    <div class="card-body" id="card8-body"></div>
  </section>

</main>

<script>
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';

  var MACROS = [
    { key: 'calories', label: 'CAL', unit: '', full: 'Calories' },
    { key: 'protein',  label: 'PRO', unit: 'g', full: 'Protein' },
    { key: 'carbs',    label: 'CARB', unit: 'g', full: 'Carbs' },
    { key: 'fat',      label: 'FAT', unit: 'g', full: 'Fat' },
  ];

  var TARGETS = { calories: 2200, protein: 150, carbs: 250, fat: 70 };

  var DATASETS = {
    empty:    { calories: 0,    protein: 0,   carbs: 0,   fat: 0 },
    under:    { calories: 900,  protein: 55,  carbs: 80,  fat: 20 },
    ontarget: { calories: 2178, protein: 150, carbs: 238, fat: 70 },
    over:     { calories: 2650, protein: 172, carbs: 300, fat: 95 },
  };

  var SWATCHES = ['#6EE7B7', '#F59E0B', '#7DD3FC', '#FB7185', '#C4B5FD'];

  var EASE_CSS = {
    ease: 'cubic-bezier(.16,1,.3,1)',
    elastic: 'cubic-bezier(.34,1.56,.64,1)',
    linear: 'linear',
    stepped: 'steps(10, end)',
  };

  var EASE_JS = {
    ease: function (t) { return 1 - Math.pow(1 - t, 3); },
    elastic: function (t) {
      var c4 = (2 * Math.PI) / 3;
      return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    },

    var thickness = document.getElementById('thickness');
    var thicknessValue = document.getElementById('thicknessValue');
    thickness.addEventListener('input', function (e) {
      state.thickness = parseInt(e.target.value, 10);
      thicknessValue.textContent = state.thickness + 'px';
      applyCssVars();
      renderAll(false);
    });

    document.getElementById('toggleValue').addEventListener('change', function (e) {
      state.showValue = e.target.checked;
      renderAll(false);
    });

    document.getElementById('toggleGlow').addEventListener('change', function (e) {
      state.glow = e.target.checked;
      renderAll(false);
    });

    document.getElementById('toggleReduced').addEventListener('change', function (e) {
      state.reducedMotion = e.target.checked;
      applyCssVars();
    });
  }

  function initCardActions() {
    document.querySelectorAll('.card').forEach(function (card) {
      var id = parseInt(card.getAttribute('data-card'), 10);

      card.querySelector('.replay-btn').addEventListener('click', function () {
        CARDS[id].render(true);
      });

      card.querySelector('.copy-btn').addEventListener('click', function (e) {
        copyText(summaryFor(id));
        var btn = e.currentTarget;
        btn.classList.add('copied');
        var prev = btn.innerHTML;
        btn.innerHTML = '&#10003;';
        setTimeout(function () {
          btn.classList.remove('copied');
          btn.innerHTML = prev;
        }, 1100);
      });
    });
  }

  function init() {
    applyCssVars();
    initSwatches();
    initControls();

    Object.keys(CARDS).forEach(function (id) {
      CARDS[id].mount(document.getElementById('card' + id + '-body'));
    });

    initCardActions();

    // Initial render at 0, then animate in on next frame.
    renderAll(false);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        renderAll(true);
      });
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

</body>
</html>
